[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility-demand-forecasting-lab"
version = "0.1.0"
description = "A reproducible time-aware demand forecasting experiment for mobility data."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
